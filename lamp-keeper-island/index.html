<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lamp Keeper Island</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: one 16:9 stage with a low-res 3D canvas; HUD strips top and bottom, crosshair + use prompt in the middle, shop as an overlay card */
:root{
  --sky:#1d64b4; --cream:#ece6d2; --salmon:#c98676; --sage:#8fbaa0; --ink:#1b2a44; --gold:#e9c66a;
  --panel:rgba(16,28,54,.9);
  --pixel:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--cream);font-family:var(--pixel);margin:0;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.frame{position:relative;width:min(100%, calc((100dvh - 24px) * 16 / 9));aspect-ratio:16/9;max-width:100%;container-type:inline-size;box-shadow:0 0 0 2px var(--ink);background:#1d64b4;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
canvas.walk{cursor:crosshair}
.hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.5cqw 1.8cqw;font-size:clamp(9px,1.6cqw,16px);letter-spacing:.05em;pointer-events:none;text-shadow:0 2px 0 var(--ink);gap:1.5cqw}
.hud.top{top:0;align-items:flex-start}.hud.bottom{bottom:0;flex-wrap:wrap}
.sub{display:block;font-size:.78em;opacity:.85;margin-top:.35em}
.group{display:flex;gap:.6em;flex-wrap:wrap}
button{font:inherit;color:var(--cream);background:var(--ink);border:0;box-shadow:inset 0 0 0 2px var(--cream);padding:.55em .85em;letter-spacing:.05em;cursor:pointer;pointer-events:auto;white-space:nowrap}
button:hover:not(:disabled){background:#2b3f63}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.hot{background:var(--salmon);color:var(--ink)}
.coins{color:var(--gold)}
.cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--cream);box-shadow:0 0 0 2px var(--ink);pointer-events:none;opacity:.85}
.cross.on{background:var(--gold);width:8px;height:8px;margin:-4px 0 0 -4px}
.prompt{position:absolute;left:50%;top:calc(50% + 3cqw);transform:translateX(-50%);font-size:clamp(9px,1.5cqw,15px)}
.prompt kbd{font:inherit;color:var(--gold);margin-right:.5em}
.prompt.hot kbd{color:var(--ink)}
.carrybar{position:absolute;left:50%;top:calc(50% + 7cqw);transform:translateX(-50%);display:flex;gap:.5em;font-size:clamp(9px,1.4cqw,14px)}
.prompt.bad{background:var(--salmon);color:var(--ink);box-shadow:none}
.hotbar{position:absolute;left:50%;bottom:1.5cqw;transform:translateX(-50%);display:flex;gap:.5cqw}
.slot{position:relative;width:4.6cqw;height:4.6cqw;min-width:30px;min-height:30px;padding:0;background:rgba(16,28,54,.72);box-shadow:inset 0 0 0 2px rgba(236,230,210,.55)}
.slot.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 2px var(--ink)}
.slot[data-count]::after{content:attr(data-count);position:absolute;right:.35em;bottom:.15em;font-size:clamp(7px,.95cqw,11px);color:var(--cream);text-shadow:0 1px 0 var(--ink)}
.bgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.5em;margin:.6em 0 .9em}
.bgrid.hb{grid-template-columns:repeat(5,minmax(0,1fr));max-width:84%;margin-left:auto;margin-right:auto}
.blabel{text-align:center}
.bgrid .slot{width:auto;height:auto;aspect-ratio:1;min-width:0}
.blabel{margin:.2em 0 0;opacity:.8;text-align:center}
.trash{align-self:center;font-size:clamp(8px,1.1cqw,12px);padding:.5em .7em;margin-left:.3em}
.card.confirm{width:min(46cqw,100%)}
.danger{background:var(--salmon);color:var(--ink)}
.slot small{position:absolute;left:.35em;top:.2em;font-size:clamp(7px,.9cqw,10px);opacity:.75}
.slot i{position:absolute;inset:22%;border-radius:50%;display:none}
.slot i.mov{display:flex;align-items:center;justify-content:center;inset:8% 4%;border-radius:0;font-style:normal;font-size:clamp(6px,.85cqw,10px);letter-spacing:.02em;color:var(--cream);background:rgba(167,132,95,.55);box-shadow:inset 0 0 0 1px rgba(236,230,210,.4)}
.upl{font:inherit;color:var(--cream);background:var(--ink);box-shadow:inset 0 0 0 2px var(--cream);padding:.55em .85em;cursor:pointer;pointer-events:auto}
#camBar{top:auto;bottom:8cqw}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
.slot i.photo{display:block;inset:10% 14% 14%;border-radius:0;background-size:cover;background-position:center;box-shadow:0 0 0 3px #f6f2e8,0 3px 0 4px #f6f2e8}
.slot i.icon{display:block;inset:6%;border-radius:0;background-size:contain;background-repeat:no-repeat;background-position:center;image-rendering:pixelated}
.slot i.ball{display:block;background:radial-gradient(circle at 35% 35%,#e88a7a,#b5473c 60%,#7d2c25);box-shadow:inset 0 -.25cqw 0 rgba(0,0,0,.25)}
.slot i.ball::after{content:"";position:absolute;left:0;right:0;top:44%;height:14%;background:#ece6d2}
.prompt.passive{pointer-events:none;box-shadow:none;background:var(--panel);opacity:.9}
.toast{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);background:var(--panel);box-shadow:0 0 0 2px var(--ink);padding:.6em 1em;font-size:clamp(9px,1.5cqw,15px);max-width:80%;text-align:center;line-height:1.5;pointer-events:none;transition:opacity .5s;text-shadow:0 2px 0 var(--ink)}
.hint{position:absolute;left:22%;right:22%;top:1.8cqw;text-align:center;font-size:clamp(8px,1.2cqw,12px);line-height:1.6;opacity:.9;pointer-events:none;text-shadow:0 2px 0 var(--ink);transition:opacity 1s}
.fade{position:absolute;inset:0;background:#060e2a;opacity:0;pointer-events:none;transition:opacity .35s}
.joy{position:absolute;width:18cqw;height:18cqw;margin:-9cqw 0 0 -9cqw;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(236,230,210,.5);pointer-events:none}
.joy.fixed{top:auto;bottom:11cqw;margin:0;width:17cqw;height:17cqw;box-shadow:inset 0 0 0 2px rgba(236,230,210,.6);background:rgba(20,27,45,.25)}
.joy.fixed.left{left:5cqw}.joy.fixed.right{left:auto;right:5cqw}

.setrow{display:flex;align-items:center;justify-content:space-between;gap:1em;margin:.9em 0}
.seg{display:flex;gap:.4em}#mpCode{width:7em;font:inherit;letter-spacing:.2em;text-transform:uppercase;background:#141b2d;color:#efe6cf;border:2px solid rgba(239,230,207,.5);padding:.3em .5em}#mpStatus b{color:#e8c66a;letter-spacing:.15em}.seg.who button{display:flex;flex-direction:column;align-items:center;gap:.2em;padding:.3em .6em}.seg.who img{width:56px;height:56px;image-rendering:pixelated}.seg button.on{background:#efe6cf;color:#1b2338}
.setrow input[type=range]{flex:1;max-width:60%;accent-color:#e8c66a}
.joy i{position:absolute;left:50%;top:50%;width:7cqw;height:7cqw;margin:-3.5cqw 0 0 -3.5cqw;border-radius:50%;background:rgba(236,230,210,.35)}
.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,18,36,.35)}
.card{background:var(--panel);box-shadow:0 0 0 2px var(--ink),0 .6cqw 0 var(--ink);padding:2.2cqw 2.6cqw;width:min(66cqw,100%);font-size:clamp(9px,1.5cqw,15px);line-height:1.55;text-shadow:0 2px 0 var(--ink);max-height:92%;overflow:auto}
.card h2{font-size:1.6em;font-weight:400;margin:0 0 .2em}
.card p{margin:0 0 .6em;opacity:.85}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin:.9em 0}
.mkh{grid-column:1/-1;font-size:.8em;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:.4em 0 -.2em}
.mkt{grid-column:1/-1;display:flex;align-items:center;gap:.5em;padding:.45em .6em;border-radius:8px;background:rgba(255,255,255,.06)}
.mkt img{width:30px;height:30px;image-rendering:pixelated;flex:none}
.mkt .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}.mkt .nm span{font-size:.8em;opacity:.7}
.mkt button{padding:.35em .6em;font-size:.85em;min-width:4.6em}
.info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;border:1.5px solid currentColor;border-radius:50%;font-size:.75em;font-weight:bold;opacity:.65;cursor:help;margin-left:.4em;vertical-align:middle;flex:none}
.info:hover,.info.on{opacity:1}
.info:hover,.info.on{z-index:20}
.mkt .nm span.info{font-size:11px;opacity:.6}.mkt .nm span.info:hover,.mkt .nm span.info.on{opacity:1}.mkt .nm span.tip{font-size:13px;opacity:1}
.info .tip{display:none;position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);width:17em;padding:.6em .75em;background:#141b2d;border:2px solid #efe6cf;color:#efe6cf;font-weight:normal;font-size:13px;opacity:1;line-height:1.35;text-align:left;z-index:5;pointer-events:none;white-space:normal}
.info:hover .tip,.info.on .tip{display:block}
.pview{position:static;inset:auto;height:auto;cursor:default;grid-column:1/-1;width:min(100%,420px);margin:0 auto;aspect-ratio:16/9;image-rendering:pixelated;border:2px solid rgba(239,230,207,.5);display:block}
.ptabs{grid-column:1/-1;display:flex;gap:.5em;flex-wrap:wrap}
.ptabs button{display:flex;align-items:center;gap:.45em;padding:.4em .7em}
.ptabs button.on{background:#efe6cf;color:#1b2338}
.chip{width:14px;height:14px;border:1.5px solid rgba(239,230,207,.8);flex:none;display:inline-block}
.swatches{grid-column:1/-1;display:flex;gap:.45em;flex-wrap:wrap;margin:.3em 0}
.swatches button{width:34px;height:34px;padding:0;border:2px solid rgba(239,230,207,.35);min-width:0}
.swatches button.on{border:3px solid #efe6cf;outline:2px solid #1b2338;outline-offset:-5px}
.pbtns{grid-column:1/-1;display:flex;gap:.6em;justify-content:flex-end}
.item{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:.2em;padding:.65em .8em;min-width:0;white-space:normal}
.item b{font-weight:400;color:var(--gold)}
.item span{font-size:.82em;opacity:.85;line-height:1.4}
.item.owned{box-shadow:inset 0 0 0 2px var(--sage)}
.row{display:flex;justify-content:space-between;align-items:center;gap:1em;flex-wrap:wrap}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:2em;font-size:clamp(10px,1.6cqw,16px);line-height:1.6}
@media (max-width:560px){.shop{grid-template-columns:1fr}.card{width:100%}}
@media (prefers-reduced-motion:reduce){.toast,.hint,.fade{transition:none}}
</style>
</head>
<body>

<div class="stage"><div class="frame" id="frame">
  <canvas id="c3" class="walk" tabindex="0" aria-label="Lighthouse island in 3D"></canvas>
  <div class="cross" id="cross"></div>
  <button class="prompt" id="prompt" hidden></button>
  <div class="carrybar" id="camBar" hidden><label class="upl" for="photoIn">Upload a photo</label><button id="camBackB">Put back on shelf</button><input type="file" id="photoIn" accept="image/*" hidden></div>
  <div class="flash" id="flash"></div>
  <div class="carrybar" id="carryBar" hidden><button id="moveB" hidden>Move it</button><button id="turnB">Turn</button><button id="storeB">Store</button><button id="cancelB">Cancel</button></div>
  <div class="joy" id="joy" hidden><i id="knob"></i></div>
  <div class="hud top">
    <div><span id="dayT">DAY 1 · SUMMER</span><span class="sub" id="clockT">7:00 AM · Clear</span></div>
    <div style="text-align:right"><span class="coins" id="coinT">0 COINS</span><span class="sub" id="lensT">Lens 65% clean</span></div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="hud bottom">
    <div class="group"><button id="setB">Settings</button><div class="group" id="remote" hidden><button id="polishB">Polish lens</button><button id="fishB">Fish</button><button id="shopB">Supply boat</button><button id="sleepB">Sleep</button></div></div>
    <div class="group"><button id="viewB">Island view</button></div>
  </div>
  <div class="hotbar" id="hotbar"><button class="slot" id="slot0" aria-label="Slot 1"><small>1</small><i></i></button><button class="slot" id="slot1" aria-label="Slot 2"><small>2</small><i></i></button><button class="slot" id="slot2" aria-label="Slot 3"><small>3</small><i></i></button><button class="slot" id="slot3" aria-label="Slot 4"><small>4</small><i></i></button><button class="slot" id="slot4" aria-label="Slot 5"><small>5</small><i></i></button><button class="trash" id="trashB" hidden title="Throw away the selected item">Discard</button></div>
  <div class="toast" id="toast" style="opacity:0"></div>
  <div class="fade" id="fade"></div>

  <div class="panel" id="confirmP" hidden><div class="card confirm">
    <h2>Are you sure?</h2>
    <p id="confirmTxt"></p>
    <div class="row"><button id="confirmNo">Keep it</button><button class="go danger" id="confirmYes">Throw it away</button></div>
  </div></div>
  <div class="panel" id="setP" hidden><div class="card">
    <h2>Settings</h2>
    <div class="setrow"><span>Keeper</span><div class="seg who"><button id="whoA"><img alt="">Bearded</button><button id="whoB"><img alt="">Long hair</button></div></div>
    <div class="setrow"><span>Play together</span><div class="seg"><button id="mpHost">Host</button><button id="mpJoin">Join</button></div></div>
    <div class="setrow" id="mpJoinRow" hidden><span>Friend's code</span><div class="seg"><input id="mpCode" maxlength="6" autocomplete="off" spellcheck="false"><button id="mpGo">Connect</button></div></div>
    <div class="setrow" id="mpRow" hidden><span id="mpStatus"></span><button id="mpLeave">Leave</button></div>
    <div class="setrow"><span>Sound</span><div class="seg"><button id="sndOn">On</button><button id="sndOff">Off</button></div></div>
    <div class="setrow" id="testRow"><span>Mobile test</span><div class="seg"><button id="testOn">On</button><button id="testOff">Off</button></div></div>
    <div class="setrow touchonly"><span>Joystick side</span><div class="seg"><button id="joyL">Left</button><button id="joyR">Right</button></div></div>
    <div class="setrow touchonly"><span>Joystick opacity <b id="joyOpT">100%</b></span><input type="range" id="joyOp" min="0" max="100" step="5"></div>
    <div class="row"><span></span><button id="closeSet">Done</button></div>
  </div></div>
  <div class="panel" id="barrelP" hidden><div class="card">
    <h2 id="barrelH">Barrel</h2>
    <p>Click an item to move it between the barrel and your hotbar.</p>
    <div class="bgrid" id="barrelGrid"></div>
    <p class="blabel">Your hotbar</p>
    <div class="bgrid hb" id="barrelHot"></div>
    <div class="row"><span></span><button id="closeBarrel">Close the barrel</button></div>
  </div></div>
  <div class="panel" id="shopP" hidden><div class="card">
    <h2>Supply boat</h2>
    <div class="shop" id="shopList"></div>
    <div class="row"><span class="coins" id="shopCoins"></span><button id="closeShop">Back to the island</button></div>
  </div></div>
</div></div>

<script>
/* ============ shared model ============ */
const DAY_LEN=240, SEASONS=['Summer','Autumn','Winter','Spring'];
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>Math.abs(((a-b+Math.PI*3)%TAU)-Math.PI);
const wrap=a=>((a%TAU)+TAU)%TAU;
const inArc=(a,s,e)=>wrap(a-s)<=wrap(e-s);           // angle a lies on the arc from s to e (increasing)
const thOf=(x,z)=>wrap(Math.atan2(x,z));             // 0 = facing +z (the door side), increasing toward +x
// phones and tablets: a coarse pointer, or a touch screen with no hover
const NATIVE_TOUCH=matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>0&&!matchMedia('(hover:hover)').matches);
// per-device settings, kept apart from the save
const SET=(()=>{let v={};try{v=JSON.parse(localStorage.getItem('lampkeeper-settings')||'{}')||{}}catch(_){}return Object.assign({joySide:'left',joyOp:100},v)})();
const isTouch=NATIVE_TOUCH||!!SET.testMobile;   // the test switch lets a computer play the phone version
function saveSet(){try{localStorage.setItem('lampkeeper-settings',JSON.stringify(SET))}catch(_){}}

/* tower geometry, shared by the building code and the walking code */
const Y0=1.9, TWR=14, RB=2.8, RTOP=1.9, WALLT=.25, TOP=Y0+TWR;
const rO=h=>RB+(RTOP-RB)*h/TWR, rI=h=>rO(h)-WALLT;
const STEP_H=.2, NSTEP=59, DPHI=.279, PHI0=.75, RISE=STEP_H*TAU/DPHI, PHIEND=PHI0+NSTEP*DPHI, PEM=wrap(PHIEND);
const YTOP=Y0+NSTEP*STEP_H, LAND=1.0;                  // the landing under the roof
const BAND=.85, SEG=48, FACET=Math.cos(Math.PI/SEG);
const rWall=y=>rI(y-Y0)*FACET-.02;                    // inner wall surface, measured to the flat facets
const stairIn=y=>rWall(y)-BAND;
const stairY=phi=>Y0+(phi-PHI0)/TAU*RISE;
const GALLERY_Y=17.125;
const LADDER_TH=wrap(PHIEND+.82), GAL_TH=wrap(LADDER_TH+.45);
const winTh=h=>wrap(PHI0+(((h-RISE/2)%RISE)+RISE)%RISE/RISE*TAU);   // between two turns of the stairs

const SHOP=[];   // the string lights and birdhouse are permanent fixtures now
const PAINT_JOBS={
  tower:{name:'lighthouse',cost:150,parts:{body:'Tower',stripes:'Stripes',trim:'Gallery'}},
  cottage:{name:'cottage',cost:100,parts:{walls:'Walls',roof:'Roof',trim:'Corners'}}};
const SWATCHES=[0xf6f3ea,0xece6d2,0xe8c66a,0xc98676,0xa4553f,0x6f9c84,0x8fb8cc,0x2f4f7a,0x3a3f4a,0x2e3640];
const LOOK0={tower:{body:0xece6d2,stripes:0xc98676,trim:0x2e3640},cottage:{walls:0xece6d2,roof:0xc98676,trim:0xd6cfb9}};
let PAINTING=null;   // {job,part,draft} while the paint picker is open
const PAINT={salmon:0xc98676,sage:0x6f9c84,navy:0x2f4f7a};
function lookOf(job){return Object.assign({},LOOK0[job],(G.look||{})[job]||{})}
const NOTES=["A note in a bottle: “Saw your light off the point. Made it home for supper.”",
  "A note in a bottle: “To whoever keeps the lamp: thank you.”",
  "A note in a bottle, just a drawing of a little lighthouse.",
  "A note in a bottle: “Fair winds from the crew of the Marigold.”",
  "A note in a bottle: “The mackerel are running east of you.”"];

let G;
function freshSave(){return {t:.04,day:1,coins:0,owned:{'paint-salmon':true},stripe:'salmon',dirt:.35,weather:'clear',wood:2,fireH:0}}
try{G=JSON.parse(localStorage.getItem('lampkeeper-island'))}catch(e){}
if(!G||typeof G.t!=='number')G=freshSave();
if(!G.seedN)G.seedN={};if(!G.pot)G.pot={items:[],prog:0,done:false};if(!Array.isArray(G.nests))G.nests=[true,true,false];if(!Array.isArray(G.layDay))G.layDay=[0,0,0];if(Array.isArray(G.inv))G.inv=G.inv.map(x=>x&&x.startsWith('mov:')?null:x);if(G.store)for(const k in G.store)G.store[k]=G.store[k].map(x=>x&&x.startsWith('mov:')?null:x);if(G.oil===undefined)G.oil=1;if(G.lastBoat===undefined)G.lastBoat=G.day||1;if(!G.look){G.look={tower:{stripes:PAINT[G.stripe]||0xc98676},cottage:{}}}if(!G.eggN)G.eggN=0;if(!Array.isArray(G.garden))G.garden=[];while(G.garden.length<8)G.garden.push(null);if(!Array.isArray(G.inv))G.inv=[null,null,null,null,null];if(G.sel===undefined)G.sel=0;if(G.wood===undefined)G.wood=2;G.wood=Math.min(12,G.wood);if(!G.layout)G.layout={};if(G.layoutV!==3){for(const k of ['basket','table','chair1','chair2','bookcase','bed','nightstand','rug'])delete G.layout[k];G.layoutV=3}if(G.fireH===undefined)G.fireH=0;
// two-player: MP.role is null (solo), 'host' (your island, a friend visiting) or 'guest' (visiting a friend's island)
const MP={role:null,conn:null,peer:null};
// a guest never writes the host's island over their own save
function save(){if(MP.role==='guest'||MP.noSave)return;try{localStorage.setItem('lampkeeper-island',JSON.stringify(G))}catch(e){}}

// P is the keeper, whether you walk as them or watch from Island view
const landTh=wrap(PHIEND+.35),landR=rWall(YTOP)-BAND/2;
const SPOT={
  pier:{x:-17.9,y:1.25,z:4,level:'ground',yaw:Math.PI/2},
  gallery:{x:Math.sin(GAL_TH)*2.3,y:GALLERY_Y,z:Math.cos(GAL_TH)*2.3,level:'gallery',yaw:GAL_TH+Math.PI},
  door:{x:0,y:1.42,z:4.3,level:'ground',yaw:Math.PI},
  landing:{x:Math.sin(landTh)*landR,y:YTOP,z:Math.cos(landTh)*landR,level:'tower',yaw:Math.atan2(-Math.cos(landTh),Math.sin(landTh))}};

/* ============ playing together (PeerJS: one player hosts, the other joins with a code) ============ */
(function(){
  const PERSONAL=new Set(['inv','sel','seedN','eggN','who','fedDay','camTaken']);   // everyone keeps their own hotbar and look
  const HOST_ONLY=new Set(['t','day','weather','boatToday','lastBoat']);            // the host's clock and calendar rule
  const DELTA=new Set(['coins','wood']);                                            // both can earn and spend: send changes, not totals
  const NEAR={dirt:.02,oil:.02,fireH:.3};                                            // values that tick on their own: only real changes count
  const norm=(k,v)=>k==='garden'?JSON.stringify((v||[]).map(c=>c&&c.type)):k==='pot'?JSON.stringify(v&&[v.items,v.done]):JSON.stringify(v);
  let base={},lastDoors='',tick=0,remoteG=null,remoteWho='';
  const status=(html,show=true)=>{$('mpStatus').innerHTML=html;$('mpRow').hidden=!show};
  MP.send=m=>{try{if(MP.conn&&MP.conn.open)MP.conn.send(m)}catch(e){}};
  MP.dogOwner='host';MP.dogMine=()=>!(MP.conn&&MP.conn.open)||MP.dogOwner===MP.role;
  // PeerJS is fetched only when someone hosts or joins; three mirrors in case one is blocked
  const PEER_SRC=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'];
  function loadPeer(cb,i=0){if(window.Peer)return cb();if(i>=PEER_SRC.length){status("Couldn't reach the connection service. Check your internet and try again.");MP.role=null;return}
    const sc=document.createElement('script');sc.src=PEER_SRC[i];sc.onload=()=>window.Peer?cb():loadPeer(cb,i+1);sc.onerror=()=>{sc.remove();loadPeer(cb,i+1)};document.head.appendChild(sc)}
  const PEER_OPTS={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]}};
  const CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789',newCode=()=>Array.from({length:6},()=>CH[Math.floor(Math.random()*CH.length)]).join('');
  const shared=()=>Object.keys(G).filter(k=>!PERSONAL.has(k));
  function snapshot(all){const out={};for(const k of shared()){const j=norm(k,G[k]);if(all||base[k]!==j){out[k]=G[k];base[k]=j}}return out}
  function refresh(){hud();if(TH){TH.paint();TH.decor()}if(window.hangSync)hangSync();if(!$('shopP').hidden)renderShop();
    if(window.ROWB&&!ROWB.seat&&!(MP.remote&&MP.remote.level==='boat')&&G.rowboat){ROWB.x=G.rowboat.x;ROWB.z=G.rowboat.z;ROWB.yaw=G.rowboat.yaw}}
  function applyState(data,fromGuest){
    for(const k in data){if(PERSONAL.has(k))continue;const v=data[k];
      if(k==='photos'){G.photos=Object.assign({},G.photos,v);base[k]=norm(k,G.photos);continue}
      if(fromGuest&&HOST_ONLY.has(k))continue;
      G[k]=v;base[k]=norm(k,v)}
    refresh()}
  function onData(m){
    if(!m||typeof m!=='object')return;
    if(m.type==='p'){MP.remote=m;MP.seen=performance.now();if(m.dog&&!MP.dogMine())MP.dogState=m.dog;
      if(m.level==='boat'&&m.seat==='front'&&m.rb&&window.ROWB&&ROWB.seat!=='front'){ROWB.x=m.rb.x;ROWB.z=m.rb.z;ROWB.yaw=m.rb.yaw;ROWB.v=0}}
    else if(m.type==='d'){[RT.doorOpen,RT.cdoorOpen,RT.coopOpen,RT.lampDoorOpen]=m.v;lastDoors=JSON.stringify(m.v)}
    else if(m.type==='s'){guestFlush();applyState(m.data,false)}                         // host → guest (send my own changes first so none get overwritten)
    else if(m.type==='g'&&MP.role==='host'){                                              // guest → host
      for(const k in (m.delta||{}))if(DELTA.has(k)){G[k]=(G[k]||0)+m.delta[k]}
      applyState(m.data||{},true);save()}
    else if(m.type==='slept'&&MP.role==='guest'){doSleep(true)}
    else if(m.type==='dog'){MP.dogOwner=m.owner;DOG.sit=m.sit;DOG.trail=[];if(MP.dogMine())MP.dogState=null}
  }
  function wire(conn){MP.conn=conn;
    conn.on('open',()=>{
      if(MP.role==='host'){base={};MP.send({type:'s',data:snapshot(true)});status('Playing together. Your code: <b>'+MP.code+'</b>')}
      else status('Visiting your friend’s island');lastDoors='';});
    conn.on('data',onData);
    conn.on('close',()=>{if(MP.role==='guest'){status('Your friend left. Leave to go back to your island.')}else{MP.conn=null;MP.remote=null;status('Your friend left. Your code: <b>'+MP.code+'</b>')}});
  }
  function host(){if(MP.role)return;MP.role='host';MP.dogOwner='host';MP.code=newCode();status('Starting…');
    loadPeer(()=>{const pr=new Peer('lampkeeper-'+MP.code,PEER_OPTS);MP.peer=pr;
      pr.on('open',()=>status('Your code: <b>'+MP.code+'</b> · waiting for a friend…'));
      pr.on('connection',c=>{if(MP.conn&&MP.conn.open){c.close();return}wire(c)});
      pr.on('error',e=>{if(e.type==='unavailable-id'){pr.destroy();MP.role=null;host()}else status('Connection problem: '+e.type)})})}
  function join(code){if(MP.role)return;code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6){status('Codes are 6 letters and numbers.');return}
    save();MP.role='guest';MP.dogOwner='host';status('Connecting…');
    loadPeer(()=>{const pr=new Peer(PEER_OPTS);MP.peer=pr;
      pr.on('open',()=>wire(pr.connect('lampkeeper-'+code,{reliable:true})));
      pr.on('error',e=>{status(e.type==='peer-unavailable'?'No island with that code. Check it and try again.':'Connection problem: '+e.type);MP.role=null;try{pr.destroy()}catch(_){}})})}
  function leave(){const wasGuest=MP.role==='guest';try{MP.conn&&MP.conn.close()}catch(_){}try{MP.peer&&MP.peer.destroy()}catch(_){}
    if(wasGuest)MP.noSave=true;MP.role=null;MP.conn=null;MP.peer=null;MP.remote=null;status('',false);if(wasGuest)location.reload()}       // a guest goes home to their own saved island
  $('mpHost').onclick=host;$('mpJoin').onclick=()=>{$('mpJoinRow').hidden=false;$('mpCode').focus()};
  $('mpGo').onclick=()=>join($('mpCode').value);$('mpCode').onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')join($('mpCode').value)};
  $('mpLeave').onclick=leave;
  window.MPdebug={host,join,leave};
  // the friend's keeper, drawn where they are
  let other=null;
  function drawOther(dt){
    const r=MP.conn&&MP.conn.open&&performance.now()-(MP.seen||0)<6000?MP.remote:null,sc=window.__scene;if(!sc)return;
    if(!r){if(other)other.visible=false;return}
    if(!other||remoteWho!==r.who){if(other)sc.remove(other);other=keeperModel(r.who||'a');remoteWho=r.who;sc.add(other);other.position.set(r.x,r.y,r.z)}
    other.visible=true;const k=Math.min(1,dt*10);other.position.x+=(r.x-other.position.x)*k;other.position.y+=(r.y-other.position.y)*k;other.position.z+=(r.z-other.position.z)*k;
    let dd=r.yaw-other.rotation.y;dd=Math.atan2(Math.sin(dd),Math.cos(dd));other.rotation.y+=dd*k}
  let lt=performance.now();
  (function mpLoop(now){const dt=Math.min(.1,(now-lt)/1000);lt=now;requestAnimationFrame(mpLoop);drawOther(dt);
    if(!(MP.conn&&MP.conn.open))return;tick+=dt;
    // where I am, ~12 times a second
    const rb=window.ROWB&&P.level==='boat'&&ROWB.seat==='front'?{x:ROWB.x,z:ROWB.z,yaw:ROWB.yaw}:null;
    if(!RT.lying)RT.sleepReady=false;
    MP.send({type:'p',x:P.x,y:P.y,z:P.z,yaw:P.yaw,level:P.level,seat:window.ROWB?ROWB.seat:null,who:G.who||'a',rb,ready:!!(RT.lying&&RT.sleepReady),dog:MP.dogMine()?{x:DOG.x,y:DOG.y,z:DOG.z,yaw:DOG.yaw,sit:DOG.sit}:null});
    if(MP.role==='host'&&RT.lying&&RT.sleepReady&&MP.remote&&MP.remote.ready){MP.remote.ready=false;MP.send({type:'slept'});doSleep()}
    const dv=JSON.stringify([RT.doorOpen,RT.cdoorOpen,RT.coopOpen,RT.lampDoorOpen].map(Boolean));if(dv!==lastDoors){lastDoors=dv;MP.send({type:'d',v:JSON.parse(dv)})}
    if(tick<.25)return;tick=0;
    if(MP.role==='host'){const d=snapshot(false);if(Object.keys(d).length)MP.send({type:'s',data:d});return}
    guestFlush()
  })(lt);
  // guest: send what I changed since the host's last word
  function guestFlush(){if(MP.role!=='guest')return;
    const data={},delta={};
    for(const k of shared()){if(HOST_ONLY.has(k))continue;const j=norm(k,G[k]);if(base[k]===undefined||base[k]===j)continue;
      if(DELTA.has(k)){const was=JSON.parse(base[k]||'0');delta[k]=(G[k]||0)-(was||0);base[k]=j;continue}
      if(k in NEAR){const was=JSON.parse(base[k]);if(Math.abs((G[k]||0)-(was||0))<NEAR[k])continue}
      data[k]=G[k];base[k]=j}
    if(Object.keys(data).length||Object.keys(delta).length)MP.send({type:'g',data,delta})}
})();
